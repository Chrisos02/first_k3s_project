# ============================================================
# nginx-deployment.yaml
# Defines the nginx Deployment and NodePort Service
# This is the "Infrastructure as Code" version of:
#   kubectl create deployment nginx --image=nginx
#   kubectl expose deployment nginx --port=80 --type=NodePort
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1               # Number of pods to run
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: NodePort            # Exposes the service on a port on the VM
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80              # Port inside the cluster
      targetPort: 80        # Port the container listens on
      # nodePort: 31686     # Uncomment to pin to a specific port
